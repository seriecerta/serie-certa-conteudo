# Publicação automática do Série Certa sem usar o Claude (zero token, fora do limite do plano).
# Roda os mesmos scripts que as rotinas rodavam: scripts/publicar.py (Instagram + YouTube) e
# blog/publicar_blog.py (blog). Todas as travas continuam nos scripts: revisao.json, PAUSAR,
# uma publicação por peça, pôster oficial, MAX_ATRASO_HORAS.
#
# Configuração (uma vez, em Settings → Secrets and variables → Actions):
#   Secret   SUPABASE_SERVICE_ROLE_KEY  = service role key do Supabase
#   Variable PUBLICACAO_AUTOMATICA      = true   (sem ela, ou com outro valor, só simula)
# Guia completo: nuvem/LEIA-ME-NUVEM.md → Passo 6.
name: publicar

on:
  schedule:
    # Horários em UTC (São Paulo = UTC−3, sem horário de verão).
    # De hora em hora no minuto :02, das 9h02 às 22h02 de Brasília (blog 9/11/14/17/20h, carrossel e Stories 10h,
    # YouTube sobe assim que aprovado e agenda pelo publishAt; o que for aprovado depois do horário sai na rodada seguinte).
    - cron: "2 12-23 * * *"
    - cron: "2 0-1 * * *"
    # Rodadas extras para os horários "e meia" da grade (Reels 13h30 e 18h30).
    - cron: "32 16,21 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (não publica nada)"
        type: boolean
        default: true

# Nunca duas rodadas ao mesmo tempo: as duas leriam o mesmo estado e poderiam postar em dobro.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODO_NUVEM: "true"  # scripts/nuvem.py baixa tokens e pacotes do Supabase e guarda o estado de volta
      SUPABASE_URL: https://idbwkhutuomakeptnyia.supabase.co
      SUPABASE_BUCKET: conteudo-redes
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLICACAO_AUTOMATICA: ${{ vars.PUBLICACAO_AUTOMATICA || 'false' }}
      MAX_ATRASO_HORAS: "4"
      MARCAR_CONTEUDO_IA: "true"
      SIMULAR: ${{ github.event_name == 'workflow_dispatch' && inputs.simular && '--simular' || '' }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Confere a configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Falta o secret SUPABASE_SERVICE_ROLE_KEY — nada foi publicado. Veja nuvem/LEIA-ME-NUVEM.md (Passo 6)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requisitos-publicar.txt

      - name: Dependências
        if: steps.cfg.outputs.ok == 'true'
        run: |
          pip install -q -r .github/requisitos-publicar.txt
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - name: Redes (Instagram + YouTube)
        if: steps.cfg.outputs.ok == 'true'
        shell: bash  # com pipefail: um erro do script deixa a rodada vermelha mesmo passando pelo tee
        run: python scripts/publicar.py --vencidos $SIMULAR 2>&1 | tee -a resumo.txt

      - name: Blog
        if: steps.cfg.outputs.ok == 'true' && !cancelled()
        shell: bash
        run: python blog/publicar_blog.py --vencidos $SIMULAR 2>&1 | tee -a resumo.txt

      - name: Resumo
        if: steps.cfg.outputs.ok == 'true' && !cancelled()
        run: |
          {
            echo "### Publicação $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            echo '```'
            grep -E '✓|✗|⏭|PAUSAR|simulação|sem revisao' resumo.txt || echo "nada no horário"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
